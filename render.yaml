# Render deployment config for FastAPI
# https://render.com/docs/deploy-fastapi

services:
  - type: web
    name: churn-prediction-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
